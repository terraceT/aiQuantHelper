; ============================================================================
;  aiQuantHelper 配置文件
;  第一次运行 start.bat 时会自动把本文件复制成 config.ini —— 请改 config.ini，不要改本文件。
;  config.ini 已在 .gitignore 里，不会被提交到 git。⛔ 不要把填了 key 的文件发给任何人。
;  等号后面直接写值，不要加引号。以 ; 开头的行是注释。
; ============================================================================

[deepseek]
; 【必填】DeepSeek 大模型 API Key（形如 sk-xxxxxxxx）。不填程序不会启动。
; 申请步骤见 README.txt 第四节：https://platform.deepseek.com → API keys → 创建 API key
api_key =
; 模型名：deepseek-flash（快、便宜，推荐）或 deepseek-v4-pro（更强、更贵）
model = deepseek-flash
base_url = https://api.deepseek.com
; 想换别的大模型（通义千问 / Kimi / GLM / 本机 Ollama……）：改上面 api_key、model、base_url 三行，
; 模型必须支持工具调用（Function Calling）。各平台地址见 README.txt 第四节「换用其他大模型」。

[binance]
; 【选填】币安 API Key 与 Secret Key。
;   两个都不填  ⇒ 演示模式（MOCK）：读 mock/ 目录里的模拟账户数据，不访问币安。
;   两个都填了  ⇒ 实盘模式（LIVE）：只读查询你的真实账户、仓位、挂单、资金流水。
;   只填了一个  ⇒ 程序拒绝启动（防止你以为在看真账户、实际看的是模拟数据）。
; 强烈建议：在币安创建 API 时只勾选「允许读取」(Enable Reading)，不要勾选交易和提现。
; 本程序没有任何下单、撤单、划转、提现的功能。
api_key =
api_secret =

; 【选填】访问币安用的代理。所在网络直连不了币安时填写，例如：
;   proxy = http://127.0.0.1:7890
; 只对访问币安生效；DeepSeek 一律直连。留空 = 直连。
proxy =

[web]
; 页面地址 http://127.0.0.1:<port>/ 。只监听本机 127.0.0.1，局域网其他机器访问不到。
port = 8866
; 启动后是否自动打开浏览器（yes / no）
open_browser = yes
